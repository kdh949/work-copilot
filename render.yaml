databases:
  - name: my-jg-mentor-db
    plan: free
    databaseName: jungleboard
    user: jungle

services:
  - type: web
    name: my-jg-mentor-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: my-jg-mentor-db
          property: connectionString
      - key: AI_SERVER_URL
        fromService:
          type: web
          name: my-jg-mentor-ai-server
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: my-jg-mentor-ai-server
    runtime: python
    plan: free
    rootDir: ai-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-jg-mentor-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: GITHUB_TOKEN
        sync: false
      - key: BLOG_SEARCH_MODE
        value: all
      - key: BLOG_SEARCH_MAX_RESULTS
        value: 5
      - key: BLOG_SYNC_ENABLED
        value: false
      - key: BLOG_SYNC_INTERVAL_HOURS
        value: 24
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
