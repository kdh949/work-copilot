services:
  - type: web
    name: week15-board-ai
    runtime: python
    repo: https://github.com/kdh949/dh-company-wiki
    plan: free
    region: oregon
    branch: main
    rootDir: backend/ai-service
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/ai-service/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: week15-board-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MCP_API_KEY
        sync: false
      - key: HOLIDAY_COUNTRY
        value: KR
      - key: HOLIDAY_API_URL
        value: https://date.nager.at/api/v3/PublicHolidays

  - type: web
    name: week15-board-api
    runtime: node
    repo: https://github.com/kdh949/dh-company-wiki
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --workspace=backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: week15-board-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: week15-board-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: week15-board-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: week15-board-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: week15-board-db
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: week15-board-ai
          property: host

  - type: web
    name: week15-board-web
    runtime: static
    repo: https://github.com/kdh949/dh-company-wiki
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
    envVars:
      - key: VITE_API_URL
        value: https://week15-board-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: week15-board-db
    databaseName: board_database_780x
    user: board_database_780x_user
    plan: free
    region: oregon
    postgresMajorVersion: "18"
