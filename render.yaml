services:
  - type: web
    name: work-copilot-ai
    runtime: python
    repo: https://github.com/kdh949/work-copilot
    plan: free
    region: oregon
    branch: feature/rename-work-copilot
    rootDir: backend/ai-service
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/ai-service/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STORE
        value: "false"
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: RAG_RETRIEVAL_MODE
        value: hybrid-chunks
      - key: RAG_MIN_CONFIDENCE
        value: "0"
      - key: OPENAI_INPUT_COST_PER_1M
        value: "0.15"
      - key: OPENAI_OUTPUT_COST_PER_1M
        value: "0.60"
      - key: MCP_API_KEY
        sync: false
      - key: HOLIDAY_COUNTRY
        value: KR
      - key: HOLIDAY_API_URL
        value: https://date.nager.at/api/v3/PublicHolidays

  - type: web
    name: work-copilot-api
    runtime: node
    repo: https://github.com/kdh949/work-copilot
    plan: free
    region: oregon
    branch: feature/rename-work-copilot
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --workspace=backend
    startCommand: npm run migration:run:compiled --workspace=backend && npm run start:prod --workspace=backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: FRONTEND_ORIGINS
        value: https://work-copilot.dhkim.cloud,https://work-copilot-web.vercel.app
      - key: KEYCLOAK_ISSUER
        sync: false
      - key: KEYCLOAK_CLIENT_ID
        sync: false
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_REDIRECT_URI
        value: https://api.work-copilot.dhkim.cloud/auth/oidc/callback
      - key: KEYCLOAK_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: OIDC_ATTEMPT_ENCRYPTION_KEY
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: INTEGRATION_ENCRYPTION_PREVIOUS_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_PREVIOUS_KEY_VERSION
        sync: false
      - key: INTEGRATION_CALLBACK_BASE_URL
        value: https://api.work-copilot.dhkim.cloud
      - key: INTEGRATION_BASE_URL_HOST_ALLOWLIST
        sync: false
      - key: INTEGRATION_JIRA_SCOPE_ALLOWLIST
        value: "READ"
      - key: INTEGRATION_CONFLUENCE_SCOPE_ALLOWLIST
        value: "READ"
      - key: TRANSIENT_CONTENT_ENCRYPTION_KEY
        sync: false
      - key: TRANSIENT_CONTENT_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: TRANSIENT_CONTENT_ENCRYPTION_PREVIOUS_KEY
        sync: false
      - key: TRANSIENT_CONTENT_ENCRYPTION_PREVIOUS_KEY_VERSION
        sync: false
      - key: AI_SERVICE_URL
        value: https://work-copilot-ai.onrender.com
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: WORK_COPILOT_CLEANUP_MAX_AGE_SECONDS
        value: "4200"
      - key: WEBHOOK_SHADOW_MODE
        value: "false"
      - key: WEBHOOK_INGRESS_VERIFIED
        value: "false"
      - key: WEBHOOK_INGRESS_ALLOWED_CIDRS
        sync: false
