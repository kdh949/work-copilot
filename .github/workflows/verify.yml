name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r backend/ai-service/requirements.txt
      - name: Verify Node tests
        run: npm test -- --runInBand --no-watchman
      - name: Verify Python tests
        working-directory: backend/ai-service
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build applications
        run: npm run build
      - name: Verify frontend lint
        run: npm run lint --workspace=frontend
      - name: Validate Docker Compose
        run: docker compose --env-file deploy/.env.production.example config --quiet
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
