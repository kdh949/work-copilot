name: Deploy jaehwan to AWS ECS

on:
  push:
    branches:
      - jaehwan
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "199301964976"
  ECS_CLUSTER: jg-jaehwan-cluster
  ECS_SERVICE: jg-jaehwan-service
  ECR_FRONTEND_REPOSITORY: jg-jaehwan-frontend
  ECR_BACKEND_REPOSITORY: jg-jaehwan-backend
  ECR_AI_REPOSITORY: jg-jaehwan-ai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::199301964976:role/jg-jaehwan-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" frontend
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" backend
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"

      - name: Build and push AI server image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_AI_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_AI_REPOSITORY:latest" ai-server
          docker push "$ECR_REGISTRY/$ECR_AI_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_AI_REPOSITORY:latest"

      - name: Remove GitHub token from ECS task definition
        id: task-definition
        run: |
          TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > task-definition.json

          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                .environment = ((.environment // []) | map(
                  if .name == "GITHUB_TOKEN" then .value = "" else . end
                ))
                | .secrets = ((.secrets // []) | map(select(.name != "GITHUB_TOKEN")))
              )
          ' task-definition.json > task-definition-without-github-token.json

          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-without-github-token.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "task-definition-arn=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS task definition
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.task-definition-arn }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
