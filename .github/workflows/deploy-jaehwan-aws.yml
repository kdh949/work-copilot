name: Take down jaehwan AWS ECS

on:
  push:
    branches:
      - jaehwan
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "199301964976"
  ECS_CLUSTER: jg-jaehwan-cluster
  ECS_SERVICE: jg-jaehwan-service

jobs:
  take-down:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::199301964976:role/jg-jaehwan-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale ECS service down
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
