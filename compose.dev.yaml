services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_copilot
    ports:
      - "5432:5432"
    volumes:
      - work-copilot-dev-postgres-data:/var/lib/postgresql/data

volumes:
  work-copilot-dev-postgres-data:
